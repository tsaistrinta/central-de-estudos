name: keep-alive

# Evita que o projeto Free do Supabase pause por inatividade (regra de 7 dias):
# faz um ping leve na API a cada 3 dias. Também dá para rodar na mão (workflow_dispatch).
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: curl -fsS "$SUPABASE_URL/rest/v1/perfis?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
